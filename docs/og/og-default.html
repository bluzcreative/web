<!doctype html>
<!-- Imagen para compartir en redes (1200x630). Regenerar con: npm run docs:og -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&family=Fraunces:ital,wght@1,400&family=Inter:wght@600&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0a0a0a;color:#fff}
  .glow{position:absolute;width:900px;height:900px;right:-260px;top:-380px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(123,255,118,.34),rgba(123,255,118,.08) 50%,transparent)}
  .wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
  img{height:34px;width:auto;filter:invert(1);align-self:flex-start}
  h1{font:500 112px/0.9 "Space Grotesk",sans-serif;letter-spacing:-.055em;margin:0}
  em{font-family:"Fraunces",serif;font-style:italic;font-weight:400;color:#7bff76;letter-spacing:-.03em}
  p{font:600 18px "Inter",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#9a9a9a;margin:0}
</style></head>
<body><div class="glow"></div><div class="wrap">
  <img src="../../public/assets/logo.svg" alt="">
  <h1>Less noise.<br>More <em>light</em>.</h1>
  <p>Paid media · Content · Branding · Web · Automation · Worldwide</p>
</div></body></html>
